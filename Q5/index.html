<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q5 · Snakes and ladders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Snakes and ladders</h1>
    <p id="status" aria-live="polite">Player 1's turn. Roll the dice!</p>
    <button id="roll">Roll dice</button>
    <div id="board" class="board" aria-label="Snakes and ladders board"></div>
    <p class="legend">🪜 Ladders: 3→22, 8→30, 28→55, 58→77, 75→96 · 🐍 Snakes: 17→4, 52→29, 57→40, 88→18, 97→79</p>
    <button id="reset" class="reset">New game</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
